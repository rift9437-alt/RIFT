name: Deploy site to GitHub Pages

# The playable site is everything in public/. This publishes that directory
# to Pages on every push to main, so the repo layout stays as it is — no
# duplicate copy of the site checked in at the repo root or under docs/.
#
# One-time setup: Settings -> Pages -> Source: "GitHub Actions".

on:
  push:
    branches: [main]
    paths:
      - 'public/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; queue instead, and don't cancel one that's
# already publishing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Pages serves index.html for a directory, but a 404 on a deep link
      # would otherwise show GitHub's own error page. The site is a
      # single-page app, so route everything back through it.
      - name: Add SPA fallback
        run: cp public/index.html public/404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - id: deployment
        uses: actions/deploy-pages@v4
